L 150.5 420" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-1" marker-end="url(#arrow)" /><path d="M 720 300 L 900 300" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-2" marker-end="url(#arrow)" /><path d="M 900 400 L 720 400" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-3" marker-end="url(#arrow)" /><path d="M 1085 445 L 1085 535" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-4" marker-end="url(#arrow)" /><path d="M 520 445 L 520 845" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-5" marker-end="url(#arrow)" /><path d="M 1465 645 L 1465 900 L 1270 900" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-6" marker-end="url(#arrow)" /><path d="M 1085 845 L 1085 700" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-7" marker-end="url(#arrow)" /><text font-family="Arial, sans-serif" font-size="28.0" text-anchor="start" font-weight="bold" fill="#172033" data-cell-id="title"><tspan x="35.0" y="45.0">CTX-01. Контекст системы MedPredict</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="legend"><tspan x="35.0" y="78.0">21.10.2026 | Работающий M2 — сплошные связи; M1/M3 — будущие задачи</tspan></text><text font-family="Arial, sans-serif" font-size="19.0" text-anchor="start" font-weight="bold" fill="#172033" data-cell-id="system"><tspan x="285.0" y="171.0">MedPredict — граница учебного прототипа</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="user"><tspan x="117.5" y="443.92">Участник</tspan><tspan x="117.5" y="465.0">демонстрации</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="front"><tspan x="520.0" y="312.82">MedPredicts/frontend — реализован</tspan><tspan x="520.0" y="335.14">React: ввод, ошибки, RU/KK/EN, PDF</tspan><tspan x="520.0" y="357.46">M2: оценка текущего САД</tspan><tspan x="520.0" y="379.78">Demo: отдельные 134,2 мм рт. ст.</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="server"><tspan x="1085.0" y="301.66">MedPredicts/backend — реализован</tspan><tspan x="1085.0" y="323.98">Spring Boot + ONNX Runtime Java</tspan><tspan x="1085.0" y="346.3">Schema / SHA-256 / version checks</tspan><tspan x="1085.0" y="368.62">Readiness и безопасные ошибки</tspan><tspan x="1085.0" y="390.94000000000005">Профили onnx и demo раздельно</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="models"><tspan x="1085.0" y="591.83">M2 — обученный ONNX, реализован</tspan><tspan x="1085.0" y="612.9100000000001">MedPredict-SBP-mlp-v2</tspan><tspan x="1085.0" y="633.99">Текущее САД; не будущее давление</tspan><tspan x="1085.0" y="655.07">M1/M3 — будущие модули</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="data"><tspan x="1470.0" y="506.29">NHANES</tspan><tspan x="1470.0" y="527.37">2017–March 2020</tspan><tspan x="1470.0" y="548.45">Официальные</tspan><tspan x="1470.0" y="569.53">public-use данные</tspan><tspan x="1470.0" y="590.61">Обучение вне UI</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="pdf"><tspan x="520.0" y="887.64">PDF на устройстве пользователя</tspan><tspan x="520.0" y="909.96">Экспорт существующего результата</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="research"><tspan x="1085.0" y="876.83">MedPredicts/ml — Python</tspan><tspan x="1085.0" y="897.9100000000001">Данные → baseline / MLP → оценка</tspan><tspan x="1085.0" y="918.99">ONNX + metadata + golden tests</tspan><tspan x="1085.0" y="940.07">Версии и контрольные суммы</tspan></text><text font-family="Arial, sans-serif" font-size="16.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-0"><tspan x="234.76" y="322.0">Ввод</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-1"><tspan x="176.05" y="437.0">Результат / ошибка</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-2"><tspan x="721.775" y="262.0">GET / POST</tspan><tspan x="721.775" y="280.6">реализованный API</tspan></text><text font-family="Arial, sans-serif" font-size="16.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-3"><tspan x="743.72" y="432.0">JSON / ошибки</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-4"><tspan x="1114.6" y="497.0">M2: startup-load</tspan></text><text font-family="Arial, sans-serif" font-size="16.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-5"><tspan x="430.92" y="687.0">Снимок</tspan><tspan x="430.92" y="706.84">по явному действию</tspan></text><text font-family="Arial, sans-serif" font-size="16.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-6"><tspan x="1388.28" y="792.0">Данные для</tspan><tspan x="1388.28" y="811.84">исследования</tspan></text><text font-family="Arial, sans-serif" font-size="16.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-7"><tspan x="1008.12" y="787.0">Версионированный</tspan><tspan x="1008.12" y="806.84">ONNX bundle</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="note-0"><tspan x="35.0" y="1002.0">M2: weighted MAE 11,225 мм рт. ст.; SBP ≥150 — MAE 41,366, недооценены все 42 случая. Клиническая применимость не установлена.</tspan></text></svg>
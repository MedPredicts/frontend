<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1160" viewBox="0 0 1600 1160" role="img" aria-labelledby="title desc"><title id="title">UC-01. Варианты использования MedPredict</title><desc id="desc">MedPredict, 21 октября 2026. Работающий исследовательский M2: React, Spring Boot и ONNX Runtime Java. M1/M3 и общий выбор остаются будущими.</desc><rect width="1600" height="1160" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><rect x="350.0" y="135.0" width="850.0" height="900.0" rx="0" stroke="#94a3b8" stroke-width="2" fill="#ffffff" data-cell-id="boundary" /><circle cx="160.0" cy="460.0" r="18" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="user" /><path d="M 160.0 478.0 L 160.0 540.0 M 122.0 500.0 L 198.0 500.0 M 160.0 540.0 L 127.0 575.0 M 160.0 540.0 L 193.0 575.0" stroke="#475569" stroke-width="2" fill="none" data-cell-id="user" /><circle cx="1430.0" cy="455.0" r="18" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="api" /><path d="M 1430.0 473.0 L 1430.0 535.0 M 1392.0 495.0 L 1468.0 495.0 M 1430.0 535.0 L 1397.0 570.0 M 1430.0 535.0 L 1463.0 570.0" stroke="#475569" stroke-width="2" fill="none" data-cell-id="api" /><ellipse cx="775.0" cy="240.0" rx="325.0" ry="45.0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="uca" /><ellipse cx="775.0" cy="370.0" rx="325.0" ry="45.0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="ucb" /><ellipse cx="775.0" cy="500.0" rx="325.0" ry="45.0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="ucc" /><ellipse cx="775.0" cy="630.0" rx="325.0" ry="45.0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="ucd" /><ellipse cx="775.0" cy="760.0" rx="325.0" ry="45.0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="uce" /><ellipse cx="775.0" cy="905.0" rx="325.0" ry="60.0" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" data-cell-id="ucf" stroke-dasharray="8 6" /><path d="M 198 500 L 365 500" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-0" /><path d="M 365 240 L 365 905" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-1" /><path d="M 365 240 L 450 240" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-2" /><path d="M 365 370 L 450 370" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-3" /><path d="M 365 500 L 450 500" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-4" /><path d="M 365 630 L 450 630" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-5" /><path d="M 365 760 L 450 760" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-6" /><path d="M 365 905 L 450 905" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-7" stroke-dasharray="8 6" /><path d="M 1000 455 L 1000 415" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-8" marker-end="url(#arrow)" stroke-dasharray="8 6" /><path d="M 1100 500 L 1430 495" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-9" /><path d="M 1100 905 L 1430 905 L 1430 640" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-10" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="28.0" text-anchor="start" font-weight="bold" fill="#172033" data-cell-id="title"><tspan x="35.0" y="45.0">UC-01. Варианты использования MedPredict</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="legend"><tspan x="35.0" y="78.0">21.10.2026 | Сплошная линия — реализовано; пунктир — будущий выбор; include — UML</tspan></text><text font-family="Arial, sans-serif" font-size="19.0" text-anchor="start" font-weight="bold" fill="#172033" data-cell-id="boundary"><tspan x="365.0" y="166.0">Пользовательский сценарий MedPredict</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="user"><tspan x="160.0" y="598.92">Участник</tspan><tspan x="160.0" y="620.0">демонстрации</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="api"><tspan x="1430.0" y="608.92">Сервис оценки M2</tspan><tspan x="1430.0" y="630.0">Spring Boot / ONNX</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="uca"><tspan x="775.0" y="235.14000000000001">UC-A. Изучить назначение, режим и ограничения</tspan><tspan x="775.0" y="257.46000000000004">FR-01, FR-09; NFR-07</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="ucb"><tspan x="775.0" y="365.14">UC-B. Ввести и проверить показатели</tspan><tspan x="775.0" y="387.46">FR-02, FR-03; NFR-02, NFR-03</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="ucc"><tspan x="775.0" y="495.14">UC-C. Получить исследовательскую оценку текущего САД</tspan><tspan x="775.0" y="517.46">FR-04, FR-07, FR-10 — M2 интегрирован</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="ucd"><tspan x="775.0" y="625.14">UC-D. Отменить ожидание / исправить ошибку</tspan><tspan x="775.0" y="647.46">FR-05, FR-06; NFR-05</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="uce"><tspan x="775.0" y="755.14">UC-E. Экспортировать полученный результат в PDF</tspan><tspan x="775.0" y="777.46">FR-08; NFR-01</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="ucf"><tspan x="775.0" y="888.9799999999999">UC-F. Выбрать модуль и проверить доступность — ПЛАН</tspan><tspan x="775.0" y="911.3">M1/M3 — будущие; M2 уже работает отдельно</tspan><tspan x="775.0" y="933.6199999999999">FR-12/FR-13: общий каталог ещё не реализован</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-8"><tspan x="1034.525" y="442.0">«include»</tspan></text><text font-family="Arial, sans-serif" font-size="16.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-9"><tspan x="1180.0" y="482.0">M2: real</tspan></text><text font-family="Arial, sans-serif" font-size="16.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-10"><tspan x="1345.48" y="772.0">Общий каталог /</tspan><tspan x="1345.48" y="791.84">будущий контракт</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="note-0"><tspan x="35.0" y="1082.0">UC-E экспортирует уже полученный результат без нового POST. Demo UC-C — только фиксированный пример.</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="note-1"><tspan x="35.0" y="1117.0">Аккаунт, вход, история и удаление не являются работающими сценариями: действия отключены (FR-11).</tspan></text></svg>
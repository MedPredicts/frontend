<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1240" viewBox="0 0 1720 1240" role="img" aria-labelledby="title desc"><title id="title">CMP-01. Компоненты и путь обработки M2</title><desc id="desc">MedPredict, 21 октября 2026. Работающий исследовательский M2: React, Spring Boot и ONNX Runtime Java. M1/M3 и общий выбор остаются будущими.</desc><rect width="1720" height="1240" fill="white" /><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" /></marker></defs><rect x="40.0" y="135.0" width="1640.0" height="525.0" rx="0" stroke="#94a3b8" stroke-width="2" fill="#ffffff" data-cell-id="frontend" /><rect x="40.0" y="705.0" width="1640.0" height="440.0" rx="0" stroke="#94a3b8" stroke-width="2" fill="#ffffff" data-cell-id="backend" /><rect x="80.0" y="210.0" width="330.0" height="100.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="ui" /><rect x="510.0" y="210.0" width="350.0" height="100.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="hook" /><rect x="990.0" y="210.0" width="350.0" height="100.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="validate" /><rect x="990.0" y="340.0" width="350.0" height="100.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="demo" /><rect x="80.0" y="470.0" width="330.0" height="100.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="http" /><rect x="510.0" y="470.0" width="350.0" height="100.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="contract" /><rect x="990.0" y="470.0" width="350.0" height="100.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="result" /><rect x="1390.0" y="470.0" width="250.0" height="100.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="pdf" /><rect x="80.0" y="765.0" width="330.0" height="105.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="rest" /><rect x="510.0" y="765.0" width="350.0" height="105.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="preprocess" /><rect x="990.0" y="765.0" width="350.0" height="105.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="inference" /><rect x="1390.0" y="765.0" width="250.0" height="105.0" rx="0" stroke="#475569" stroke-width="2" fill="#edf5fb" data-cell-id="response" /><rect x="80.0" y="1000.0" width="420.0" height="100.0" rx="0" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" data-cell-id="m1" stroke-dasharray="8 6" /><rect x="620.0" y="1000.0" width="420.0" height="100.0" rx="0" stroke="#25634b" stroke-width="2" fill="#edf8f1" data-cell-id="m2" /><rect x="1160.0" y="1000.0" width="480.0" height="100.0" rx="0" stroke="#8b5e34" stroke-width="2" fill="#fff8ed" data-cell-id="m3" stroke-dasharray="8 6" /><path d="M 410 260 L 510 260" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-0" marker-end="url(#arrow)" /><path d="M 860 260 L 990 260" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-1" marker-end="url(#arrow)" /><path d="M 510 285 L 460 285 L 460 520 L 410 520" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-2" marker-end="url(#arrow)" /><path d="M 860 285 L 920 285 L 920 390 L 990 390" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-3" marker-end="url(#arrow)" /><path d="M 410 520 L 510 520" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-4" marker-end="url(#arrow)" /><path d="M 685 470 L 685 310" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-5" marker-end="url(#arrow)" /><path d="M 860 300 L 890 300 L 890 450 L 1165 450 L 1165 470" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-6" marker-end="url(#arrow)" /><path d="M 1340 520 L 1390 520" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-7" marker-end="url(#arrow)" /><path d="M 245 570 L 245 680 L 20 680 L 20 817 L 80 817" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-8" marker-end="url(#arrow)" /><path d="M 410 818 L 510 818" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-9" marker-end="url(#arrow)" /><path d="M 860 818 L 990 818" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-10" marker-end="url(#arrow)" /><path d="M 1340 818 L 1390 818" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-11" marker-end="url(#arrow)" /><path d="M 1515 765 L 1515 690 L 685 690 L 685 570" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-12" marker-end="url(#arrow)" /><path d="M 1165 870 L 1165 950 L 290 950 L 290 1000" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-13" marker-end="url(#arrow)" stroke-dasharray="8 6" /><path d="M 1165 870 L 1165 950 L 830 950 L 830 1000" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-14" marker-end="url(#arrow)" /><path d="M 1165 950 L 1400 950 L 1400 1000" fill="none" stroke="#475569" stroke-width="2" stroke-linejoin="round" data-cell-id="edge-15" marker-end="url(#arrow)" stroke-dasharray="8 6" /><text font-family="Arial, sans-serif" font-size="28.0" text-anchor="start" font-weight="bold" fill="#172033" data-cell-id="title"><tspan x="35.0" y="45.0">CMP-01. Компоненты и путь обработки M2</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="legend"><tspan x="35.0" y="78.0">21.10.2026 | Сплошная линия — реализовано; пунктир — будущие M1/M3 и общий выбор</tspan></text><text font-family="Arial, sans-serif" font-size="19.0" text-anchor="start" font-weight="bold" fill="#172033" data-cell-id="frontend"><tspan x="55.0" y="166.0">MedPredicts/frontend: реализованный React + TypeScript / Vite</tspan></text><text font-family="Arial, sans-serif" font-size="19.0" text-anchor="start" font-weight="bold" fill="#172033" data-cell-id="backend"><tspan x="55.0" y="736.0">MedPredicts/backend: Spring Boot / Java ONNX; реализован только M2</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="ui"><tspan x="245.0" y="255.14000000000001">App / pages / Field / i18n</tspan><tspan x="245.0" y="277.46000000000004">Навигация, поля, RU/KK/EN</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="hook"><tspan x="685.0" y="255.14000000000001">usePrediction</tspan><tspan x="685.0" y="277.46000000000004">Состояния, отмена, снимок ввода</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="validate"><tspan x="1165.0" y="255.14000000000001">validation.ts</tspan><tspan x="1165.0" y="277.46000000000004">Проверка и преобразование ввода</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="demo"><tspan x="1165.0" y="374.87">api/demo.ts — локальный demo</tspan><tspan x="1165.0" y="395.95">Фиксированные 134,2 мм рт. ст.</tspan><tspan x="1165.0" y="417.03">Нейронная сеть не вызывается</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="http"><tspan x="245.0" y="515.14">api/http.ts + environment.ts</tspan><tspan x="245.0" y="537.46">Явный real; timeout; GET / POST</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="contract"><tspan x="685.0" y="515.14">api/contract.ts</tspan><tspan x="685.0" y="537.46">Проверка метаданных и ответа</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="result"><tspan x="1165.0" y="515.14">ResultPanel / PredictionPage</tspan><tspan x="1165.0" y="537.46">Число, единицы, ввод, ограничения</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="pdf"><tspan x="1515.0" y="504.87">pdf/report.ts</tspan><tspan x="1515.0" y="525.95">Локальный PDF</tspan><tspan x="1515.0" y="547.03">Без нового запроса</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="rest"><tspan x="245.0" y="802.37">Spring Boot REST API</tspan><tspan x="245.0" y="823.45">GET / POST + readiness</tspan><tspan x="245.0" y="844.53">Валидация / no-store / 503</tspan></text><text font-family="Arial, sans-serif" font-size="18.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="preprocess"><tspan x="685.0" y="801.4799999999999">Независимая валидация</tspan><tspan x="685.0" y="823.8">Типы, категории, домен metadata</tspan><tspan x="685.0" y="846.1199999999999">Preprocessing внутри ONNX</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="inference"><tspan x="1165.0" y="802.37">ONNX Runtime Java (CPU)</tspan><tspan x="1165.0" y="823.45">SHA-256 / schema / version</tspan><tspan x="1165.0" y="844.53">float32 [batch,5] → [batch,1]</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="response"><tspan x="1515.0" y="785.55">API Response</tspan><tspan x="1515.0" y="804.15">predictedValue / unit /</tspan><tspan x="1515.0" y="822.75">version</tspan><tspan x="1515.0" y="841.3499999999999">predictionType / demo /</tspan><tspan x="1515.0" y="859.9499999999999">ошибка</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="m1"><tspan x="290.0" y="1034.8700000000001">M1 — Diabetes Progression, ПЛАН</tspan><tspan x="290.0" y="1055.95">Отдельный baseline + MLP</tspan><tspan x="290.0" y="1077.0300000000002">Не реализован; не диагноз</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="m2"><tspan x="830.0" y="1034.8700000000001">M2 — реализован: текущий САД</tspan><tspan x="830.0" y="1055.95">MedPredict-SBP-mlp-v2 / NHANES</tspan><tspan x="830.0" y="1077.0300000000002">Оценка, не прогноз будущего</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="middle" font-weight="normal" fill="#172033" data-cell-id="m3"><tspan x="1400.0" y="1034.8700000000001">M3 — временная глюкоза, ПЛАН</tspan><tspan x="1400.0" y="1055.95">Продольные данные / временная модель</tspan><tspan x="1400.0" y="1077.0300000000002">Набор и горизонт ещё не выбраны</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-0"><tspan x="418.8" y="244.0">Действия</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-1"><tspan x="883.8" y="244.0">Проверка</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-2"><tspan x="425.9" y="397.0">real</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-3"><tspan x="925.9" y="327.0">demo</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-4"><tspan x="435.9" y="547.0">JSON</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-5"><tspan x="601.05" y="407.0">Проверенные данные</tspan></text><text font-family="Arial, sans-serif" font-size="15.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-8"><tspan x="135.4" y="637.0">GET /api/v1/model/info</tspan><tspan x="135.4" y="655.6">POST /api/v1/predictions</tspan></text><text font-family="Arial, sans-serif" font-size="16.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="edge-label-12"><tspan x="957.08" y="685.0">JSON → проверка → состояние → UI</tspan></text><text font-family="Arial, sans-serif" font-size="16.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="note-0"><tspan x="80.0" y="932.0">M2 исполняется внутри Spring Boot; M1/M3 и общий переключатель — план. Обучение: отдельный MedPredicts/ml.</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="note-1"><tspan x="35.0" y="1192.0">Ввод хранится в памяти frontend; нет хранения показателей в localStorage/sessionStorage, аналитике или логах приложения.</tspan></text><text font-family="Arial, sans-serif" font-size="17.0" text-anchor="start" font-weight="normal" fill="#172033" data-cell-id="note-2"><tspan x="35.0" y="1222.0">M2: MAE 11,225; SBP ≥150 — MAE 41,366, все 42 недооценены. Общий каталог, auth/history и временной API ещё не реализованы.</tspan></text></svg>